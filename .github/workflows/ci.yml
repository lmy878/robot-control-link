name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Build tests
        run: make test
      - name: Run automated test suites
        run: python3 tests/run_tests.py --quick
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rclp-test-report
          path: tests/results/
